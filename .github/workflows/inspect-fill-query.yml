name: Inspect native fill query and actor paths
on:
  workflow_dispatch:
  push:
    branches: [fix/fill-query, diagnostic/actor-visibility]
    paths: [analysis/fill-query/review_native.py, .github/workflows/inspect-fill-query.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install capstone==5.0.3
      - run: python analysis/fill-query/review_native.py
      - uses: actions/upload-artifact@v4
        with:
          name: Core-fill-query-review
          path: analysis/fill-query/output/*
          retention-days: 14
