name: Build Core cosmetics adaptation
on:
  workflow_dispatch:
  pull_request:
    branches: [feat/kernel-cosmetics]
    paths:
      - 'patch/**'
      - 'scripts/**'
      - 'tests/**'
      - 'analysis/cosmetics/采集版使用说明.txt'
      - '.github/workflows/build*.yml'
  push:
    branches: [feat/kernel-cosmetics]
    paths:
      - 'patch/**'
      - 'scripts/**'
      - 'tests/**'
      - 'analysis/cosmetics/采集版使用说明.txt'
      - '.github/workflows/build*.yml'
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      cosmetics_probe: true
