name: Build selective weapons and actor visibility IPA
on:
  workflow_dispatch:
  push:
    branches: [diagnostic/actor-visibility]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install --user --break-system-packages unicorn==2.1.4
      - run: python3 -m unittest discover -s tests -v
      - name: Check actor stage diagnostics and live pipeline with sanitizers
        run: |
          xcrun clang -O2 -DCORE_NEARBY_VEHICLES=1 -DCORE_OVERLAY_LATENCY=1 -DCORE_FILL_WORK=1 -DCORE_ACTOR_TRACE=1 -fsanitize=address,undefined -fno-omit-frame-pointer -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -framework Foundation tests/test_model_live_runtime.m -o /tmp/core-actor-test
          /tmp/core-actor-test
      - name: Check parallel and reference raster
        run: |
          xcrun clang -O2 -fblocks -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra -Werror tests/test_model_raster_work.m -o /tmp/core-raster-work-test
          /tmp/core-raster-work-test
          xcrun clang -O2 -fblocks -fsanitize=thread -Wall -Wextra -Werror tests/test_model_raster_work.m -o /tmp/core-raster-thread-test
          /tmp/core-raster-thread-test
      - name: Check model boundaries and standalone capture compatibility
        run: |
          for task in model_references model_binding model_mesh_evidence model_gpu_streams model_skinning model_pixels model_raster model_reflection model_ray_abi; do
            xcrun clang -O2 -Wall -Wextra -Werror tests/test_${task}_runtime.c -o /tmp/core-${task}-test
            /tmp/core-${task}-test
          done
          xcrun clang -O2 -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -framework Foundation tests/test_model_capture_runtime.m -o /tmp/core-capture-test
          /tmp/core-capture-test
      - run: node --test tests/test_model_mesh_preview.mjs
      - name: Build device IPA
        run: python3 scripts/build.py --model-render --nearby-vehicles --overlay-latency --fill-work --actor-trace --weapon-display
      - name: Verify exact payload and entry forwarding
        run: |
          python3 scripts/verify.py dist/Core-17.0-21A327-TrollStore-model-render-v15-actor-visibility.ipa
          python3 scripts/check_model_capture_entry.py dist/Core-17.0-21A327-TrollStore-model-render-v15-actor-visibility.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Core-v15-actor-visibility
          path: dist/*
          retention-days: 14
