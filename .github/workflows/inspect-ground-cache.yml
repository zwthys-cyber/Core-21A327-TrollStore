name: Inspect v17 ground cache screen and projection gates
on:
  workflow_dispatch:
  push:
    branches: [analysis/ground-cache-gates]
    paths: [analysis/ground-cache/review.py, .github/workflows/inspect-ground-cache.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install capstone==5.0.3
      - run: python analysis/ground-cache/review.py
      - uses: actions/upload-artifact@v4
        with:
          name: Core-ground-cache-review
          path: analysis/ground-cache/output/*
          retention-days: 14
