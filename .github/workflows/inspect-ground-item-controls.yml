name: Inspect airdrop classifier and ground control preferences
on:
  workflow_dispatch:
  push:
    branches: [feat/ground-item-controls]
    paths: [analysis/ground-item-controls/review.py, .github/workflows/inspect-ground-item-controls.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install capstone==5.0.3
      - run: python analysis/ground-item-controls/review.py
      - uses: actions/upload-artifact@v4
        with:
          name: Core-ground-item-controls-review
          path: analysis/ground-item-controls/output/*
          retention-days: 14
