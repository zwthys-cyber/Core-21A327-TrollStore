name: Build nearby vehicles and live mesh IPA
on:
  workflow_dispatch:
  push:
    branches: [feat/nearby-vehicles]
    paths-ignore: [analysis/**, .github/workflows/inspect-nearby-vehicles.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ARM64 test dependency
        run: python3 -m pip install --user --break-system-packages unicorn==2.1.4
      - name: Check native vehicle filtering, UI, ranges and baseline behavior
        run: python3 -m unittest discover -s tests -v
      - name: Check live pipeline with sanitizers and vehicle build identity
        run: |
          xcrun clang -O2 -DCORE_NEARBY_VEHICLES=1 -fsanitize=address,undefined -fno-omit-frame-pointer -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -framework Foundation tests/test_model_live_runtime.m -o /tmp/core-model-live-test
          /tmp/core-model-live-test
      - name: Check full-resolution raster and model boundaries
        run: |
          for task in model_references model_binding model_mesh_evidence model_gpu_streams model_skinning model_pixels model_raster model_reflection model_ray_abi; do
            xcrun clang -O2 -Wall -Wextra -Werror tests/test_${task}_runtime.c -o /tmp/core-${task}-test
            /tmp/core-${task}-test
          done
      - name: Check capture forwarding
        run: |
          xcrun clang -O2 -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -framework Foundation tests/test_model_capture_runtime.m -o /tmp/core-capture-test
          /tmp/core-capture-test
      - run: node --test tests/test_model_mesh_preview.mjs
      - name: Build nearby vehicle IPA
        run: python3 scripts/build.py --model-render --nearby-vehicles
      - name: Verify exact payload, permissions and signatures
        run: python3 scripts/verify.py dist/Core-17.0-21A327-TrollStore-model-render-v12-nearby-vehicles.ipa
      - name: Check compiled capture and draw entries
        run: python3 scripts/check_model_capture_entry.py dist/Core-17.0-21A327-TrollStore-model-render-v12-nearby-vehicles.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Core-live-mesh-fill-v12-nearby-vehicles
          path: dist/*
          retention-days: 14
