name: Build TrollStore IPA
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      cosmetics_probe:
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ARM64 instruction-test dependency
        run: python3 -m pip install --user --break-system-packages unicorn==2.1.4
      - name: Run packaging tests
        run: python3 -m unittest discover -s tests -v
      - name: Test hook publication against an immediate concurrent callback
        run: |
          xcrun clang -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -framework Foundation -framework IOKit tests/test_hook_runtime.m -o /tmp/core-hook-test
          /tmp/core-hook-test
      - name: Test native Mach message forwarding and diagnostic isolation
        run: |
          xcrun clang -O2 -Wall -Wextra -Werror tests/test_remote_trace_runtime.c -o /tmp/core-remote-test
          /tmp/core-remote-test
      - name: Build device dylib and TrollStore IPA
        run: python3 scripts/build.py ${{ inputs.cosmetics_probe && '--cosmetics-probe' || '' }}
      - name: Test cosmetics identity gate, array bounds and changing target data
        if: inputs.cosmetics_probe
        run: |
          xcrun clang -O2 -Wall -Wextra -Werror tests/test_cosmetics_read.c -o /tmp/core-cosmetics-test
          /tmp/core-cosmetics-test
          xcrun clang -O2 -Wall -Wextra -Werror tests/test_cosmetics_write_check.c -o /tmp/core-cosmetics-write-test
          /tmp/core-cosmetics-write-test
          xcrun clang -O2 -Wall -Wextra -Werror tests/test_cosmetics_trial.c -o /tmp/core-cosmetics-trial-test
          /tmp/core-cosmetics-trial-test
          xcrun clang -O2 -Wall -Wextra -Werror tests/test_cosmetics_page.c -o /tmp/core-cosmetics-page-test
          /tmp/core-cosmetics-page-test
          xcrun clang -O2 -Wall -Wextra -Werror tests/test_cosmetics_vehicle.c -o /tmp/core-cosmetics-vehicle-test
          /tmp/core-cosmetics-vehicle-test
          xcrun clang -O2 -Wall -Wextra -Werror tests/test_cosmetics_vehicle_trial.c -o /tmp/core-cosmetics-vehicle-trial-test
          /tmp/core-cosmetics-vehicle-trial-test
          xcrun clang -O2 -Wall -Wextra -Werror tests/test_cosmetics_vehicle_entity.c -o /tmp/core-cosmetics-vehicle-entity-test
          /tmp/core-cosmetics-vehicle-entity-test
      - name: Build independent cache preparation app
        run: python3 scripts/build_preparation.py
      - name: Test prepared transfer identity, current boot, digest and file checks
        run: |
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation tests/test_prepared_cache_runtime.m -o /tmp/core-prepared-test
          /tmp/core-prepared-test
      - name: Test probe transfer, malformed responses and child cleanup
        run: |
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation tests/test_boot_probe_runtime.m -o /tmp/core-probe-test
          /tmp/core-probe-test
      - name: Validate output
        run: |
          if [ '${{ inputs.cosmetics_probe }}' = 'true' ]; then
            python3 scripts/verify.py dist/Core-17.0-21A327-cosmetics-vehicle-r26.ipa --cosmetics-probe
          else
            python3 scripts/verify.py dist/Core-17.0-21A327-TrollStore-v19-600m.ipa
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.cosmetics_probe && 'Core-cosmetics-vehicle-r26' || 'Core-17.0-21A327-TrollStore-v19-600m' }}
          path: dist/*
          retention-days: 14
