name: Inspect original far-target acquisition
on:
  workflow_dispatch:
  push:
    branches: [analysis/far-targets]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install disassembly dependency
        run: python -m pip install capstone==5.0.3
      - name: Inspect pinned baseline acquisition and range checks
        run: python analysis/far-targets/review_acquisition.py
      - uses: actions/upload-artifact@v4
        with:
          name: Core-far-target-acquisition-review
          path: analysis/far-targets/output/*
          retention-days: 14
