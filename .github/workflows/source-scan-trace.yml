name: Build upstream source scan diagnostic IPA
on:
  workflow_dispatch:
  push:
    branches: [diagnostic/ground-source-scan]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install --user --break-system-packages unicorn==2.1.4
      - run: python3 -m unittest discover -s tests -v
      - name: Check ground whitelist reports and live pipeline with sanitizers
        run: |
          xcrun clang -O2 -DCORE_NEARBY_VEHICLES=1 -DCORE_OVERLAY_LATENCY=1 -DCORE_FILL_WORK=1 -DCORE_ACTOR_TRACE=1 -DCORE_WEAPON_DISPLAY=1 -DCORE_GROUND_BOW_TRACE=1 -DCORE_GROUND_ESSENTIALS=1 -DCORE_GROUND_LATE_CAMERA=1 -DCORE_GROUND_ITEM_CONTROLS=1 -DCORE_SOURCE_SCAN_TRACE=1 -fsanitize=address,undefined -fno-omit-frame-pointer -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -framework Foundation tests/test_model_live_runtime.m -o /tmp/core-essentials-test
          /tmp/core-essentials-test
      - name: Check unchanged full precision parallel raster
        run: |
          xcrun clang -O2 -fblocks -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra -Werror tests/test_model_raster_work.m -o /tmp/core-raster-test
          /tmp/core-raster-test
          xcrun clang -O2 -fblocks -fsanitize=thread -Wall -Wextra -Werror tests/test_model_raster_work.m -o /tmp/core-raster-thread-test
          /tmp/core-raster-thread-test
      - name: Check model boundaries and standalone capture
        run: |
          for task in model_references model_binding model_mesh_evidence model_gpu_streams model_skinning model_pixels model_raster model_reflection model_ray_abi; do
            xcrun clang -O2 -Wall -Wextra -Werror tests/test_${task}_runtime.c -o /tmp/core-${task}-test
            /tmp/core-${task}-test
          done
          xcrun clang -O2 -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -framework Foundation tests/test_model_capture_runtime.m -o /tmp/core-capture-test
          /tmp/core-capture-test
      - run: node --test tests/test_model_mesh_preview.mjs
      - run: python3 scripts/build.py --model-render --nearby-vehicles --overlay-latency --fill-work --actor-trace --weapon-display --ground-bow-trace --ground-essentials --ground-late-camera --ground-item-controls --source-scan-trace
      - name: Verify exact native display paths and device payload
        run: |
          python3 scripts/verify.py dist/Core-17.0-21A327-TrollStore-model-render-v19-source-scan.ipa
          python3 scripts/check_model_capture_entry.py dist/Core-17.0-21A327-TrollStore-model-render-v19-source-scan.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Core-v19-source-scan
          path: dist/*
          retention-days: 14
