name: Inspect native Core cosmetics menu
on:
  workflow_dispatch:
  push:
    branches: [feat/kernel-cosmetics]
    paths:
      - '.github/workflows/inspect-cosmetics-menu.yml'
      - 'analysis/cosmetics/inspect_menu.py'
      - 'analysis/cosmetics/menu-windows.json'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m pip install --only-binary=:all: capstone==5.0.6
      - run: python3 analysis/cosmetics/inspect_menu.py
      - uses: actions/upload-artifact@v4
        with:
          name: Core-native-menu-review
          path: menu-output/*
          retention-days: 14
