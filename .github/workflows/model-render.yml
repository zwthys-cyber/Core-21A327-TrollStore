name: Build live mesh fill IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install instruction-test dependency
        run: python3 -m pip install --user --break-system-packages unicorn==2.1.4
      - name: Check baseline and exact pre-signing draw/import changes
        run: python3 -m unittest discover -s tests -v
      - name: Check capture forwarding boundaries
        run: |
          xcrun clang -O2 -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -framework Foundation tests/test_model_capture_runtime.m -o /tmp/core-model-capture-test
          /tmp/core-model-capture-test
      - name: Check the production live pipeline
        run: |
          xcrun clang -O2 -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -framework Foundation tests/test_model_live_runtime.m -o /tmp/core-model-live-test
          /tmp/core-model-live-test
      - name: Check reference, geometry, reflection, skinning and pixel boundaries
        run: |
          for task in model_references model_binding model_mesh_evidence model_gpu_streams model_skinning model_pixels model_reflection model_ray_abi; do
            xcrun clang -O2 -Wall -Wextra -Werror tests/test_${task}_runtime.c -o /tmp/core-${task}-test
            /tmp/core-${task}-test
          done
      - name: Check offline preview regression
        run: node --test tests/test_model_mesh_preview.mjs
      - name: Build live device IPA
        run: python3 scripts/build.py --model-render
      - name: Verify payload and signatures
        run: python3 scripts/verify.py dist/Core-17.0-21A327-TrollStore-model-render-v9.ipa
      - name: Check compiled observer and draw veneers
        run: python3 scripts/check_model_capture_entry.py dist/Core-17.0-21A327-TrollStore-model-render-v9.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Core-live-mesh-fill-v9
          path: dist/*
          retention-days: 14
