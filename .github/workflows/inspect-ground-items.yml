name: Inspect existing ground painkiller and level 3 backpack identifiers
on:
  workflow_dispatch:
  push:
    branches: [feat/ground-essentials]
    paths: [analysis/ground-items/review.py, .github/workflows/inspect-ground-items.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install capstone==5.0.3
      - run: python analysis/ground-items/review.py
      - uses: actions/upload-artifact@v4
        with:
          name: Core-ground-essentials-review
          path: analysis/ground-items/output/*
          retention-days: 14
