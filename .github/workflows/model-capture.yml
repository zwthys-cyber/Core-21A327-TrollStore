name: Build model runtime capture IPA
on:
  workflow_dispatch:
    inputs:
      model_render:
        description: Build the continuous live mesh fill variant
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install instruction-test dependency
        run: python3 -m pip install --user --break-system-packages unicorn==2.1.4
      - name: Check unchanged baseline and optional import redirect
        run: python3 -m unittest discover -s tests -v
      - name: Test runtime frame, transform and original-query boundaries
        run: |
          xcrun clang -O2 -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -framework Foundation tests/test_model_capture_runtime.m -o /tmp/core-model-capture-test
          /tmp/core-model-capture-test
      - name: Build device capture IPA
        env:
          CORE_BUILD_LIVE: ${{ inputs.model_render }}
        run: |
          if [[ "$CORE_BUILD_LIVE" == true ]]; then
            python3 scripts/build.py --model-render
          else
            python3 scripts/build.py --model-capture
          fi
      - name: Test continuous native mesh fill and per-pixel queries
        if: inputs.model_render
        run: |
          xcrun clang -O2 -fsanitize=address -fno-omit-frame-pointer -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -framework Foundation tests/test_model_live_runtime.m -o /tmp/core-model-live-test
          /tmp/core-model-live-test
      - name: Test full native ray results and tail-write canaries
        run: |
          xcrun clang -O2 -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra -Werror tests/test_model_ray_abi_runtime.c -o /tmp/core-model-ray-abi-test
          /tmp/core-model-ray-abi-test
      - name: Test precise pixel rasterization and guarded property reflection
        run: |
          xcrun clang -O2 -Wall -Wextra -Werror tests/test_model_pixels_runtime.c -o /tmp/core-model-pixels-test
          /tmp/core-model-pixels-test
          xcrun clang -O2 -Wall -Wextra -Werror tests/test_model_reflection_runtime.c -o /tmp/core-model-reflection-test
          /tmp/core-model-reflection-test
      - name: Test bounded component reference candidate reads
        run: |
          xcrun clang -O2 -Wall -Wextra -Werror tests/test_model_references_runtime.c -o /tmp/core-model-references-test
          /tmp/core-model-references-test
      - name: Test resource pointer links, reference hierarchy and names
        run: |
          xcrun clang -O2 -Wall -Wextra -Werror tests/test_model_binding_runtime.c -o /tmp/core-model-binding-test
          /tmp/core-model-binding-test
      - name: Test mesh reference skeletons, master maps and native source bounds
        run: |
          xcrun clang -O2 -Wall -Wextra -Werror tests/test_model_mesh_evidence_runtime.c -o /tmp/core-model-mesh-evidence-test
          /tmp/core-model-mesh-evidence-test
      - name: Test LOD descriptors, GPU stream chunks and session budgets
        run: |
          xcrun clang -O2 -Wall -Wextra -Werror tests/test_model_gpu_streams_runtime.c -o /tmp/core-model-gpu-streams-test
          /tmp/core-model-gpu-streams-test
      - name: Test inverse bind, weighted skinning and verified section layout
        run: |
          xcrun clang -O2 -Wall -Wextra -Werror tests/test_model_skinning_runtime.c -o /tmp/core-model-skinning-test
          /tmp/core-model-skinning-test
      - name: Test offline preview, attachment poses and standalone packaging
        run: node --test tests/test_model_mesh_preview.mjs
      - name: Verify exact payload, optional forwarding exports and signatures
        run: python3 scripts/verify.py dist/*.ipa
      - name: Check the compiled ARM64 entry and forwarding stack
        run: python3 scripts/check_model_capture_entry.py dist/*.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.model_render && 'Core-live-mesh-fill-v3' || 'Core-model-runtime-capture-v7' }}
          path: dist/*
          retention-days: 14
