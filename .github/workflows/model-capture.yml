name: Build model runtime capture IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install instruction-test dependency
        run: python3 -m pip install --user --break-system-packages unicorn==2.1.4
      - name: Check unchanged baseline and optional import redirect
        run: python3 -m unittest discover -s tests -v
      - name: Test runtime frame, transform and original-query boundaries
        run: |
          xcrun clang -O2 -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -framework Foundation tests/test_model_capture_runtime.m -o /tmp/core-model-capture-test
          /tmp/core-model-capture-test
      - name: Build device capture IPA
        run: python3 scripts/build.py --model-capture
      - name: Test bounded component reference candidate reads
        run: |
          xcrun clang -O2 -Wall -Wextra -Werror tests/test_model_references_runtime.c -o /tmp/core-model-references-test
          /tmp/core-model-references-test
      - name: Verify exact payload, optional forwarding exports and signatures
        run: python3 scripts/verify.py dist/Core-17.0-21A327-TrollStore-model-capture-v3.ipa
      - name: Check the compiled ARM64 entry and forwarding stack
        run: python3 scripts/check_model_capture_entry.py dist/Core-17.0-21A327-TrollStore-model-capture-v3.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Core-model-runtime-capture-v3
          path: dist/*
          retention-days: 14
